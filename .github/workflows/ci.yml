name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run balance
      - run: npm run build
      - run: node scripts/verify-prod-bundle.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E (Dev Suite — Desktop + Pixel 7)
        run: npx playwright test
      - name: Run Playwright E2E (Production Preview dist/ — Desktop + Pixel 7)
        run: PLAYWRIGHT_PREVIEW=1 npx playwright test --grep-invert @dev-only
